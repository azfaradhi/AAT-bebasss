version: '3.8'

services:
  bmkg-mock:
    build:
      context: .
      dockerfile: services/bmkg-mock/Dockerfile
    ports:
      - "${BMKG_PORT:-8081}:8081"
    env_file:
      - .env
    environment:
      - BMKG_PORT=8081
    networks:
      - bnpb_network

  pvmbg-mock:
    build:
      context: .
      dockerfile: services/pvmbg-mock/Dockerfile
    ports:
      - "${PVMBG_PORT:-8082}:8082"
    env_file:
      - .env
    environment:
      - PVMBG_PORT=8082
    networks:
      - bnpb_network

  aggregator:
    build:
      context: .
      dockerfile: services/aggregator/Dockerfile
    ports:
      - "${AGGREGATOR_PORT:-8090}:8090"
    env_file:
      - .env
    environment:
      - AGGREGATOR_PORT=8090
    networks:
      - bnpb_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - bnpb_network

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "${AUTH_SERVICE_PORT:-8091}:8091"
    env_file:
      - .env
    environment:
      - AUTH_SERVICE_PORT=8091
    networks:
      - bnpb_network

  dashboard-updater:
    build:
      context: .
      dockerfile: services/consumers/dashboard-updater/Dockerfile
    ports:
      - "${DASHBOARD_CONSUMER_PORT:-8092}:8092"
    env_file:
      - .env
    environment:
      - DASHBOARD_CONSUMER_PORT=8092
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - bnpb_network

  notifier:
    build:
      context: .
      dockerfile: services/consumers/notifier/Dockerfile
    ports:
      - "${NOTIFIER_CONSUMER_PORT:-8093}:8093"
    env_file:
      - .env
    environment:
      - NOTIFIER_CONSUMER_PORT=8093
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - bnpb_network

networks:
  bnpb_network:
    driver: bridge
