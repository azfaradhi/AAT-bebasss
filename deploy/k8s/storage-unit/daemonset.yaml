# P1-K1 & PLAT-2: DaemonSet placing 1 storage unit per labelled node (bnpb/storage=true)
# with node-local persistent storage on hostPath /var/lib/bnpb/store.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: storage-unit
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: { app: storage-unit, role: store }
spec:
  selector:
    matchLabels: { app: storage-unit }
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels: { app: storage-unit, role: store } # TA-6 & PLAT-8
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8100"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        bnpb/storage: "true"
      terminationGracePeriodSeconds: 30
      initContainers:
        # The hostPath dir is created by the node (root, 0755) but the app runs as uid 1000: without this the
        # unit cannot write its log (EACCES), never persists, and a replaced pod cannot even receive repair (HTTP 500 on /u/apply).
        - name: fix-store-permissions
          image: node-a:5000/bnpb-storage-unit:m2
          command: ["sh", "-c", "chown -R 1000:1000 /var/lib/bnpb/store"]
          securityContext: { runAsUser: 0 }
          volumeMounts:
            - name: store-data
              mountPath: /var/lib/bnpb/store
          resources:
            requests: { memory: "512Mi", cpu: "100m" }
            limits:   { memory: "1Gi", cpu: "500m" }
      containers:
        - name: storage-unit
          image: node-a:5000/bnpb-storage-unit:m2
          ports: [{ name: http, containerPort: 8100 }]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
          envFrom:
            - configMapRef: { name: storage-unit-config }
          volumeMounts:
            - name: store-data
              mountPath: /var/lib/bnpb/store
          # The unit replays its append-only log before it listens (9-11 MB after an hour of load on k3s), which took longer
          # than the old 20 s liveness budget and put every unit in a restart loop. startupProbe gives it up to 5 min.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { memory: "512Mi", cpu: "100m" }
            limits:   { memory: "1Gi", cpu: "500m" }
      volumes:
        - name: store-data
          hostPath:
            path: /var/lib/bnpb/store
            type: DirectoryOrCreate
