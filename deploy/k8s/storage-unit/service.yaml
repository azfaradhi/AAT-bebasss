apiVersion: v1
kind: Service
metadata:
  name: storage-unit
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: { app: storage-unit, role: store }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: storage-unit }
  ports:
    - name: http
      port: 8100
      targetPort: http
