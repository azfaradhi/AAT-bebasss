apiVersion: apps/v1
kind: Deployment
metadata:
  name: satellite-processor
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: { app: satellite-processor, role: broker, app.kubernetes.io/part-of: bnpb }
spec:
  replicas: 1 # raise to 2 once the real Coordinator is wired (a standby must not open the stream)
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: satellite-processor } }
  template:
    metadata:
      labels: { app: satellite-processor, role: broker, app.kubernetes.io/part-of: bnpb }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8095", prometheus.io/path: /metrics }
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: satellite-processor } } }
      containers:
        - name: satellite-processor
          image: registry.local/bnpb-satellite-processor:latest
          ports: [{ containerPort: 8095 }]
          envFrom: [{ configMapRef: { name: satellite-processor-config } }]
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: SAT_GROUP_TOKEN, valueFrom: { secretKeyRef: { name: group-token, key: token } } }
          resources:
            requests: { memory: 512Mi }
            limits: { memory: 1Gi }
          startupProbe: { httpGet: { path: /health, port: 8095 }, failureThreshold: 30, periodSeconds: 2 }
          readinessProbe: { httpGet: { path: /ready, port: 8095 }, periodSeconds: 2, failureThreshold: 2 }
          livenessProbe: { httpGet: { path: /health, port: 8095 }, periodSeconds: 10, failureThreshold: 6 }
          lifecycle: { preStop: { exec: { command: ["sleep", "10"] } } }
