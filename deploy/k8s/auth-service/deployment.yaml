apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: { app: auth-service, role: api }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service, role: api } # TA-6
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8091"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: auth-service }
      containers:
        - name: auth-service
          image: node-a:5000/bnpb-auth-service:m2
          ports: [{ name: http, containerPort: 8091 }]
          env:
            - name: CLIENT_JWT_SECRET
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: CLIENT_JWT_SECRET } }
            - name: AUTH_MEDIA_CLIENT_ID
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: AUTH_MEDIA_CLIENT_ID } }
            - name: AUTH_MEDIA_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: AUTH_MEDIA_CLIENT_SECRET } }
            - name: AUTH_LAPANGAN_CLIENT_ID
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: AUTH_LAPANGAN_CLIENT_ID } }
            - name: AUTH_LAPANGAN_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: AUTH_LAPANGAN_CLIENT_SECRET } }
            - name: AUTH_INTERNAL_CLIENT_ID
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: AUTH_INTERNAL_CLIENT_ID } }
            - name: AUTH_INTERNAL_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: AUTH_INTERNAL_CLIENT_SECRET } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
          envFrom:
            - configMapRef: { name: auth-service-config }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep ${PRESTOP_DRAIN_SECONDS:-3}"] }
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits:   { memory: "256Mi", cpu: "500m" }
