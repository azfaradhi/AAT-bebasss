apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-dashboard
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: { app: analytics-dashboard, role: other }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: analytics-dashboard }
  template:
    metadata:
      labels: { app: analytics-dashboard, role: other } # TA-6
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: analytics-dashboard
          image: node-a:5000/bnpb-analytics-dashboard:m2
          ports: [{ name: http, containerPort: 8110 }]
          envFrom:
            - configMapRef: { name: analytics-dashboard-config }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits:   { memory: "256Mi", cpu: "500m" }
