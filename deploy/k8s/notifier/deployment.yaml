apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: { app: notifier, role: consumer }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: notifier }
  template:
    metadata:
      labels: { app: notifier, role: consumer } # TA-6
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8093"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: notifier
          image: node-a:5000/bnpb-notifier:m2
          ports: [{ name: http, containerPort: 8093 }]
          env:
            - name: RABBITMQ_URL
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: RABBITMQ_URL } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
          envFrom:
            - configMapRef: { name: notifier-config }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits:   { memory: "256Mi", cpu: "500m" }
