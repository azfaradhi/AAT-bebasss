apiVersion: apps/v1
kind: Deployment
metadata:
  name: advisor
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: { app: advisor, role: other, app.kubernetes.io/part-of: bnpb }
spec:
  replicas: 1 # interim in-memory Coordinator: raise to 2 once the real one is wired
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: advisor } }
  template:
    metadata:
      labels: { app: advisor, role: other, app.kubernetes.io/part-of: bnpb }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8097", prometheus.io/path: /metrics }
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: advisor } } }
      containers:
        - name: advisor
          image: registry.local/bnpb-advisor:latest
          ports: [{ containerPort: 8097 }]
          envFrom: [{ configMapRef: { name: advisor-config } }]
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: ADVISOR_LLM_API_KEY, valueFrom: { secretKeyRef: { name: advisor-llm, key: api-key, optional: true } } } # optional: no key means template-only mode
            - { name: INTERNAL_SERVICE_KEY, valueFrom: { secretKeyRef: { name: internal-service-key, key: key } } }
          resources:
            requests: { memory: 128Mi }
            limits: { memory: 256Mi }
          startupProbe: { httpGet: { path: /health, port: 8097 }, failureThreshold: 30, periodSeconds: 2 }
          readinessProbe: { httpGet: { path: /ready, port: 8097 }, periodSeconds: 2, failureThreshold: 2 }
          livenessProbe: { httpGet: { path: /health, port: 8097 }, periodSeconds: 10, failureThreshold: 6 }
          lifecycle: { preStop: { exec: { command: ["sleep", "10"] } } }
