# NetworkPolicy for RabbitMQ broker (CONTRACT-MEMBER-3.md §1.5):
# Only aggregator, api, consumer, broker (inter-node clustering), and observability (Prometheus) may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-ingress
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  podSelector:
    matchLabels: { app: rabbitmq }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: role
                operator: In
                values: [aggregator, api, consumer, broker]
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
