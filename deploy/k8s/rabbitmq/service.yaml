apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: { app: rabbitmq, role: broker }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: management, port: 15672, targetPort: management }
    - { name: epmd, port: 4369, targetPort: epmd }
    - { name: dist, port: 25672, targetPort: dist }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: { app: rabbitmq, role: broker }
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: management, port: 15672, targetPort: management }
    - { name: prometheus, port: 15692, targetPort: prometheus }
