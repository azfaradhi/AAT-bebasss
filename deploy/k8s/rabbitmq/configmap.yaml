apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: sistem-informasi-kebencanaan-bnpb
data:
  enabled_plugins: "[rabbitmq_management,rabbitmq_peer_discovery_k8s,rabbitmq_prometheus]."
  rabbitmq.conf: |
    cluster_formation.peer_discovery_backend = rabbit_peer_discovery_k8s
    cluster_formation.k8s.host = kubernetes.default.svc.cluster.local
    cluster_formation.k8s.address_type = hostname
    cluster_formation.k8s.service_name = rabbitmq-headless
    cluster_formation.k8s.hostname_suffix = .rabbitmq-headless.sistem-informasi-kebencanaan-bnpb.svc.cluster.local
    cluster_formation.node_cleanup.interval = 10
    cluster_formation.node_cleanup.only_log_warning = true
    cluster_partition_handling = autoheal
    queue_master_locator = min-masters
    loopback_users.guest = false
    default_queue_type = quorum
    prometheus.return_per_object_metrics = true
