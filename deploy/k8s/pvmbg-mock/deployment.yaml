apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvmbg-mock
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: { app: pvmbg-mock, role: mock, app.kubernetes.io/part-of: bnpb }
spec:
  replicas: 1
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: pvmbg-mock } }
  template:
    metadata:
      labels: { app: pvmbg-mock, role: mock, app.kubernetes.io/part-of: bnpb }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8082", prometheus.io/path: /metrics }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: pvmbg-mock
          image: registry.local/bnpb-pvmbg-mock:latest
          ports: [{ containerPort: 8082 }]
          envFrom: [{ configMapRef: { name: pvmbg-mock-config } }]
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: PVMBG_JWT_SECRET, valueFrom: { secretKeyRef: { name: jwt, key: pvmbg-secret } } }
          resources:
            requests: { memory: 64Mi }
            limits: { memory: 128Mi }
          startupProbe: { httpGet: { path: /health, port: 8082 }, failureThreshold: 30, periodSeconds: 2 }
          readinessProbe: { httpGet: { path: /ready, port: 8082 }, periodSeconds: 2, failureThreshold: 2 }
          livenessProbe: { httpGet: { path: /health, port: 8082 }, periodSeconds: 10, failureThreshold: 6 }
          lifecycle: { preStop: { exec: { command: ["sleep", "10"] } } }
