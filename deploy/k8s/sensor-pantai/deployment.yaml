# Lampiran C: Sensor Pantai, based on the assistants' sample manifest.
# Image digest, env names and the exam-key mount are unchanged from the sample; only namespace,
# resources (Q4) and probes were added. Demo/exam: set PANTAI_PROFILE=exam and enable the key mount
# (see scripts/demo/exam-switchover.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-pantai
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: { app: sensor-pantai, role: sensor }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: sensor-pantai }
  template:
    metadata:
      labels: { app: sensor-pantai, role: sensor }
    spec:
      containers:
        - name: sensor
          image: sustuna/sensor-pantai@sha256:51fbd90d3891ad6e9f5768ad330ffb65205644cb29e50da65c7538f2e0b4397d
          env:
            - { name: PANTAI_PROFILE, value: practice } # demo: exam
            - { name: PANTAI_SEED, value: "42" }
            - { name: PANTAI_SPEED, value: "60" }
            - name: PANTAI_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: pantai-token, key: token } }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits: { memory: "256Mi", cpu: "250m" }
          volumeMounts:
            - { name: data, mountPath: /data }
            # Demo only: Secret 'pantai-key' holds the assistants' file 'key'.
            # - { name: key, mountPath: /var/run/pantai, readOnly: true }
      volumes:
        - { name: data, emptyDir: {} }
        # - name: key
        #   secret: { secretName: pantai-key }
