apiVersion: apps/v1
kind: Deployment
metadata:
  name: field-report-processor
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: { app: field-report-processor, role: consumer }
spec:
  replicas: 1 # interim in-memory Coordinator/ring: raise to 2 once the real ones are wired
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: field-report-processor }
  template:
    metadata:
      labels: { app: field-report-processor, role: consumer } # TA-6
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8095"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: field-report-processor }
      containers:
        - name: field-report-processor
          image: node-a:5000/bnpb-field-report-processor:m2
          ports: [{ name: http, containerPort: 8095 }]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
          envFrom:
            - configMapRef: { name: field-report-processor-config }
            - secretRef: { name: bnpb-secrets }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits:   { memory: "256Mi", cpu: "500m" }
