# TEMPLATE ONLY — Never commit real secret values to git (PLAT-4).
# Run `make secrets` (which reads .env.local via `kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -`)
# to create the actual Kubernetes Secret objects at deploy time.
apiVersion: v1
kind: Secret
metadata:
  name: bnpb-secrets
  namespace: sistem-informasi-kebencanaan-bnpb
type: Opaque
stringData:
  JWT_SECRET: "<REPLACE_IN_ENV_LOCAL>"
  AUDIT_TOKEN: "<REPLACE_IN_ENV_LOCAL>"
  SAT_AUTH_TOKEN: "<REPLACE_IN_ENV_LOCAL>"
  RABBITMQ_DEFAULT_USER: "<REPLACE_IN_ENV_LOCAL>"
  RABBITMQ_DEFAULT_PASS: "<REPLACE_IN_ENV_LOCAL>"
  RABBITMQ_ERLANG_COOKIE: "<REPLACE_IN_ENV_LOCAL>"
  RABBITMQ_URL: "<REPLACE_IN_ENV_LOCAL>"
---
apiVersion: v1
kind: Secret
metadata:
  name: pantai-token
  namespace: sistem-informasi-kebencanaan-bnpb
type: Opaque
stringData:
  token: "<REPLACE_IN_ENV_LOCAL>"
---
# Exam-only key secret (Lampiran C.4 — created only during live exam when key file is provided)
apiVersion: v1
kind: Secret
metadata:
  name: pantai-key
  namespace: sistem-informasi-kebencanaan-bnpb
type: Opaque
stringData:
  key: "<EXAM_KEY_FILE_CONTENTS>"
