# RBAC for Aggregator leader election (Kubernetes Leases & cursor ConfigMaps) and RabbitMQ peer discovery.
# The Tester Agent installs its own RBAC from its official manifest; nothing here may touch it (TA-2).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aggregator-sa
  namespace: sistem-informasi-kebencanaan-bnpb
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aggregator-leader-role
  namespace: sistem-informasi-kebencanaan-bnpb
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aggregator-leader-binding
  namespace: sistem-informasi-kebencanaan-bnpb
subjects:
  - kind: ServiceAccount
    name: aggregator-sa
    namespace: sistem-informasi-kebencanaan-bnpb
roleRef:
  kind: Role
  name: aggregator-leader-role
  apiGroup: rbac.authorization.k8s.io
---
# RBAC for RabbitMQ k8s peer discovery (endpoints/pods read)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq-sa
  namespace: sistem-informasi-kebencanaan-bnpb
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-peer-discovery-role
  namespace: sistem-informasi-kebencanaan-bnpb
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-peer-discovery-binding
  namespace: sistem-informasi-kebencanaan-bnpb
subjects:
  - kind: ServiceAccount
    name: rabbitmq-sa
    namespace: sistem-informasi-kebencanaan-bnpb
roleRef:
  kind: Role
  name: rabbitmq-peer-discovery-role
  apiGroup: rbac.authorization.k8s.io
